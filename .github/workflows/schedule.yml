name: Trigger XAUUSD analysis

on:
  schedule:
    # รันวันละ 4 รอบ ตามเวลาไทย (UTC+7): 08:07 / 12:07 / 16:07 / 20:07 น. ไทย เฉพาะวันจันทร์-ศุกร์
    # (เลื่อนนาทีเป็น 7 ไม่ใช่นาทีที่ 0 ตามคำแนะนำของ GitHub เอง เพราะนาทีที่ 0 ของทุกชั่วโมงคือช่วงที่
    # คิวงาน schedule ของทั้งโลกแน่นที่สุด ทำให้ดีเลย์ง่ายกว่าปกติ — GitHub Actions schedule เป็นแบบ
    # "best-effort" เสมอ ไม่การันตีตรงเวลา 100%)
    #
    # ทั้ง 4 รอบนี้ (08:00-20:00 ไทย) แปลงเป็น UTC แล้วตรงกับวันปฏิทินเดียวกัน (01:00/05:00/09:00/13:00 UTC)
    # ไม่มีรอบไหนข้ามวันแบบ UTC เหมือนรอบ 06:00 ไทยของตารางเดิม จึงใช้ cron บรรทัดเดียวพอ ไม่ต้องแยกวัน
    - cron: '7 1,5,9,13 * * 1-5' # = 08:07 / 12:07 / 16:07 / 20:07 น. ไทย (จันทร์-ศุกร์)
  workflow_dispatch: {} # กดรันเองได้จากแท็บ Actions เพื่อทดสอบ

jobs:
  call-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/analyze endpoint
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.ANALYZE_URL }}")
          echo "HTTP status: $response"
          cat /tmp/response.json
          if [ "$response" -ge 400 ]; then
            echo "Request failed with status $response"
            exit 1
          fi
