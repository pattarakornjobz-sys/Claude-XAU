name: Trigger XAUUSD analysis

on:
  schedule:
    # รันทุก 4 ชม. เฉพาะวันจันทร์-ศุกร์ ที่ ~07:07 / 11:07 / 15:07 / 19:07 / 23:07 น. เวลาไทย (UTC+7)
    # = 00:07 / 04:07 / 08:07 / 12:07 / 16:07 UTC วันจันทร์-ศุกร์ (วันตรงกับไทยพอดี เพราะเวลาที่ใช้ >= 07:00 ไทยเสมอ)
    # หมายเหตุ: ตั้งใจเลื่อนนาทีให้ไม่ตรงชั่วโมงเป๊ะ (ไม่ใช่นาทีที่ 0) ตามคำแนะนำของ GitHub เอง
    # เพราะนาทีที่ 0 ของทุกชั่วโมงคือช่วงที่คิวงาน schedule ของทั้งโลกแน่นที่สุด ทำให้ดีเลย์ง่ายกว่าปกติ
    # ถึงอย่างนั้น GitHub Actions schedule ก็ยังเป็นแบบ "best-effort" เสมอ ไม่การันตีตรงเวลา 100%
    - cron: '7 0,4,8,12,16 * * 1-5'
  workflow_dispatch: {} # กดรันเองได้จากแท็บ Actions เพื่อทดสอบ

jobs:
  call-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/analyze endpoint
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.ANALYZE_URL }}")
          echo "HTTP status: $response"
          cat /tmp/response.json
          if [ "$response" -ge 400 ]; then
            echo "Request failed with status $response"
            exit 1
          fi
