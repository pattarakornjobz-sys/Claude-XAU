name: Trigger XAUUSD analysis

on:
  schedule:
    # รันทุก 2 ชม. เฉพาะวันจันทร์-ศุกร์ ตั้งแต่ ~06:07 ถึง ~22:07 น. เวลาไทย (UTC+7) รวม 9 รอบ/วัน:
    # 06:07 / 08:07 / 10:07 / 12:07 / 14:07 / 16:07 / 18:07 / 20:07 / 22:07 น. ไทย
    #
    # หมายเหตุ: ตั้งใจเลื่อนนาทีเป็น 7 (ไม่ใช่นาทีที่ 0) ตามคำแนะนำของ GitHub เอง เพราะนาทีที่ 0
    # ของทุกชั่วโมงคือช่วงที่คิวงาน schedule ของทั้งโลกแน่นที่สุด ทำให้ดีเลย์ง่ายกว่าปกติ
    # ถึงอย่างนั้น GitHub Actions schedule ก็ยังเป็นแบบ "best-effort" เสมอ ไม่การันตีตรงเวลา 100%
    #
    # ต้องแยกเป็น 2 บรรทัด เพราะรอบ 06:07 น. ไทย ตรงกับ 23:07 UTC ของ "วันก่อนหน้า" ตามปฏิทิน UTC
    # (เช่น จันทร์ 06:07 ไทย = อาทิตย์ 23:07 UTC) เลยต้องใช้วันอาทิตย์-พฤหัสฯ (0-4) ฝั่ง UTC
    # ส่วนอีก 8 รอบที่เหลือ (08:07-22:07 ไทย) ตรงกับวันเดียวกันทั้ง UTC และไทย เลยใช้ จันทร์-ศุกร์ (1-5) ตรงๆ ได้
    - cron: '7 1,3,5,7,9,11,13,15 * * 1-5' # = 08:07/10:07/12:07/14:07/16:07/18:07/20:07/22:07 น. ไทย
    - cron: '7 23 * * 0-4' # = 06:07 น. ไทย (ของวันจันทร์-ศุกร์)
  workflow_dispatch: {} # กดรันเองได้จากแท็บ Actions เพื่อทดสอบ

jobs:
  call-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/analyze endpoint
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.ANALYZE_URL }}")
          echo "HTTP status: $response"
          cat /tmp/response.json
          if [ "$response" -ge 400 ]; then
            echo "Request failed with status $response"
            exit 1
          fi
